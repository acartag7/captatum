name: release

# Builds and publishes the gateway + browser Docker images to GHCR on a `v*` tag,
# and publishes the npm package captatum via Trusted Publishing (OIDC,
# passwordless — no NPM_TOKEN). A gate job (check + unit tests) runs first;
# everything publishes only if it passes. On a dry-run (workflow_dispatch) the
# images are built but not pushed.
#
# Images are multi-arch (linux/amd64 + linux/arm64) so the arm64 Mac mini k3s
# deploy pulls ghcr.io/acartag7/captatum:latest natively instead of building
# locally. arm64 is cross-built via QEMU on the amd64 runner (see setup-qemu).
#
# All actions are pinned by commit SHA (supply-chain hardening); versions + dates
# are recorded in docs/dependency-ledger.md. The npm job requires a Trusted
# Publisher configured on npmjs.com (user: acartag7, repo: captatum, workflow:
# release.yml); the npm CLI auto-exchanges the GitHub OIDC token.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm run test:acceptance  # frozen acceptance suite (activated phases)
      # The release gate must also run the REAL-Chromium security fixtures — the
      # threat model's hosted-ship condition (SSRF + popup egress). Until now a
      # v* tag could publish npm+GHCR with no browser test having run anywhere
      # (2026-09-01 finding: both the popup-egress regression and tier3-ssrf
      # were absent from every publish path).
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify Chromium launches (no silent skip)
        run: node --input-type=module -e "const {chromium}=await import('playwright'); const b=await chromium.launch(); await b.close();"
      - run: node --no-warnings --test test/integration/fixtures.test.ts test/integration/popup-egress.test.ts test/integration/tier3-ssrf.test.ts

  images:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # Multi-arch: QEMU registers binfmt handlers so buildx cross-builds arm64 on
      # the amd64 runner. Both base images (node:24-bookworm-slim,
      # mcr.microsoft.com/playwright:v1.61.0-noble) ship multi-arch manifest lists
      # (verified — both carry linux/amd64 + linux/arm64), so FROM resolves arm64.
      # (Native ubuntu-24.04-arm runners are a future optimization if QEMU build
      # time becomes a concern; these images are light — the gateway does no native
      # compile and the sidecar only COPYs a script onto the playwright base.)
      - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0 (2026-05-27, 39d)
        with:
          # Pin the binfmt image by digest — the action's default is
          # tonistiigi/binfmt:latest (mutable), and this step runs BEFORE the
          # packages:write build, so a repushed/compromised :latest could affect
          # the build/GHCR token despite the action SHA pin. Digest == the
          # `qemu-v10.2.3` tag == `:latest` as of 2026-06-08 (27d, 15-day gate OK).
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta-gateway
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/acartag7/captatum
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=sha,format=short
      - id: meta-browser
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/acartag7/captatum-browser
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=sha,format=short
      # Gateway image — no browser binary (Tier-3 uses the sidecar over CDP), so it
      # stays small and keeps Chromium out of the gateway's blast radius.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta-gateway.outputs.tags }}
          labels: ${{ steps.meta-gateway.outputs.labels }}
      # Browser sidecar image — the long-lived Chromium the gateway connects to.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile.browser
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta-browser.outputs.tags }}
          labels: ${{ steps.meta-browser.outputs.labels }}

  # Publish captatum to npm via Trusted Publishing (OIDC, passwordless).
  # Requires the trusted publisher configured on npmjs.com for this package:
  # GitHub Actions — user: acartag7, repo: captatum, workflow: release.yml.
  # The npm CLI (>=11.5.1) auto-exchanges the GitHub OIDC token when
  # id-token: write is granted — no NPM_TOKEN secret needed. Provenance is
  # automatic for OIDC from public repos.
  npm:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build        # compile src/*.ts → dist/*.js (Node won't type-strip .ts in node_modules)
      - run: npm publish --access public --provenance

  # Create the GitHub Releases page entry (auto-generated notes) after images + npm publish.
  # The build/publish jobs above don't create the Releases page entry on their own — without this
  # step, only a manually-created release (v0.2.0) ever appeared on the Releases page.
  release-entry:
    needs: [gate, images, npm]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pass the tag through an env var (set by the runner) — NOT interpolated into the `run:`
          # script. github.ref_name is attacker-controlled (tag names can hold $(…) which GitHub
          # expands before the shell starts, even inside double quotes), so referencing $TAG as a
          # shell variable is the injection-safe form.
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --generate-notes --title "$TAG"
