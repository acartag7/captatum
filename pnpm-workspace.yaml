packages:
  - "."

# 15 days, in minutes. Requires pnpm >= 10.16.0.
minimumReleaseAge: 21600

# No minimumReleaseAgeExclude entries (removed 2026-09-02): the former mcp-sso
# own-package exception and the advisory-driven hono 4.12.34 exception both aged past
# the 15-day gate and were retired. Own packages follow the SAME floor — an owner-side
# push is as able to carry a bad publish as a stranger's, so no own-package bypass is
# recorded here. Advisory history: docs/dependency-ledger.md.
