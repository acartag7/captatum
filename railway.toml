# Railway service config for the captatum gateway (hosted flavor).
# `railway.toml` covers build/deploy knobs; the service IMAGE and the persistent
# VOLUME are set in the Railway dashboard (or via the `railway` CLI) — see
# deploy/railway.md.
#
# Storage: the default SQLite file pair needs a node-writable 0700 volume at /data.
#   Dashboard: Settings → Volumes → add a volume at /data.
#   Env: CAPTATUM_SQLITE_PATH=/data/captatum.sqlite
#   Derived client file: /data/captatum.sqlite.clients
#
# Tier-3 (JS rendering): DO NOT bundle Chromium with the gateway or share its
# network namespace — a no-sandbox browser in the gateway namespace can bind a
# temporarily free gateway port and receive the edge authenticator after a restart
# (threat model: browser never shares the gateway/cloudflared namespace). On
# Railway the safe option is to leave CAPTATUM_BROWSER_CDP_ENDPOINT unset (no
# CDP workload is configured, so Tier-3 reports render-unavailable on JS shells;
# note allowRender defaults TRUE for single-fetch — the endpoint, not the flag,
# is the switch). For Tier-3 use a deployment shape with the isolated browser
# Pod topology (init-container netns firewall + CDP relay). NOTE: no public
# Tier-3 deployment guide exists in this repository — deploy/mac-mini.md covers
# the gateway-only path and the reference browser-Pod topology lives elsewhere;
# the boundary REQUIREMENTS are specified in docs/threat-model.md. See
# deploy/railway.md for details.

[deploy]
startCommand = "node --no-warnings src/server.ts"
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
